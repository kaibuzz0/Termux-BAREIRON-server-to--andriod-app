name: Build Server + Android App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-24.04
    name: Server | compile + diagnostics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare diagnostics directory
        run: mkdir -p diagnostics

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download cosmocc
        run: |
          set -o pipefail
          {
            curl -fL -o cosmocc.zip https://cosmo.zip/pub/cosmocc/cosmocc.zip
            unzip -q cosmocc.zip -d cosmocc
          } 2>&1 | tee diagnostics/cosmocc-setup.log
          echo "$PWD/cosmocc/bin" >> "$GITHUB_PATH"

      - name: Install JDK 24
        run: |
          set -o pipefail
          {
            curl -fL -o openjdk-24.0.2_linux-x64_bin.tar.gz https://download.java.net/java/GA/jdk24.0.2/fdc5d0102fe0414db21410ad5834341f/12/GPL/openjdk-24.0.2_linux-x64_bin.tar.gz
            tar -xzf openjdk-24.0.2_linux-x64_bin.tar.gz
          } 2>&1 | tee diagnostics/jdk24-setup.log

      - name: Dump Minecraft server registries
        working-directory: server
        run: |
          set -o pipefail
          mkdir -p notchian
          {
            cd notchian
            curl -fL -o server.jar https://piston-data.mojang.com/v1/objects/6bce4ef400e4efaa63a13d5e6f6b500be969ef81/server.jar
            echo "eula=true" > eula.txt
            ../../jdk-24.0.2/bin/java -DbundlerMainClass="net.minecraft.data.Main" -jar server.jar --all
          } 2>&1 | tee ../diagnostics/registry-dump.log

      - name: Generate registry headers
        working-directory: server
        run: |
          set -o pipefail
          bun run build_registries.js 2>&1 | tee ../diagnostics/registry-generation.log

      - name: Build server binary
        id: server_build
        working-directory: server
        run: |
          set -o pipefail
          cosmocc src/*.c -O2 -Iinclude -o bareiron -lssl -lcrypto 2>&1 | tee ../diagnostics/server-build.log

      - name: Verify server artifact
        if: success()
        working-directory: server
        run: |
          set -euo pipefail
          test -s bareiron
          ls -lh bareiron
          file bareiron | tee ../diagnostics/server-artifact.txt

      - name: Server build summary
        if: always()
        run: |
          {
            echo "## BAREIRON server CI"
            echo
            echo "- Build step: **${{ steps.server_build.outcome }}**"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Diagnostic artifact: \`server-ci-diagnostics-${{ github.run_id }}\`"
            echo
            echo "Open the failed step for the live compiler error, or download the diagnostic artifact for the complete captured logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-ci-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload server artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bareiron-server
          path: server/bareiron
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-24.04
    name: Android | assembleDebug + diagnostics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare diagnostics directory
        run: mkdir -p diagnostics

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Grant execute permissions
        working-directory: app
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Android APK
        id: android_build
        working-directory: app
        run: |
          set -o pipefail
          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon assembleDebug --stacktrace --warning-mode all 2>&1 | tee ../diagnostics/android-build.log
          else
            gradle --no-daemon assembleDebug --stacktrace --warning-mode all 2>&1 | tee ../diagnostics/android-build.log
          fi

      - name: Verify APK artifact
        if: success()
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No debug APK was produced." >&2
            exit 1
          fi
          ls -lh "${apks[@]}" | tee diagnostics/android-artifacts.txt

      - name: Android build summary
        if: always()
        run: |
          {
            echo "## BAREIRON Android CI"
            echo
            echo "- Build step: **${{ steps.android_build.outcome }}**"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Diagnostic artifact: \`android-ci-diagnostics-${{ github.run_id }}\`"
            echo
            echo "The Gradle log includes stack traces and warnings so the failing task and cause are visible directly in CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/
            app/**/build/reports/
            app/**/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bareiron-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    name: Release | publish verified artifacts
    needs: [build-server, build-android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Download server artifact
        uses: actions/download-artifact@v4
        with:
          name: bareiron-server
          path: ./artifacts/

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: bareiron-apk
          path: ./artifacts/

      - name: List artifacts
        run: ls -lah ./artifacts/

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BAREIRON Latest Build
          body: |
            Rolling release of BAREIRON Server + Android Content Manager.

            This release is published only after both the server and Android build jobs pass.

            | File | Description |
            |------|-------------|
            | `bareiron` | Server binary (Cosmopolitan, runs on Linux/Windows/Mac) |
            | `app-debug.apk` | Android Content Manager APK |
          files: ./artifacts/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
