name: Build Server + Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-24.04
    name: Build BAREIRON Server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download cosmocc
        run: |
          curl -LO https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip cosmocc.zip -d cosmocc
          echo "$PWD/cosmocc/bin" >> $GITHUB_PATH

      - name: Install JDK 24
        run: |
          curl -LO https://download.java.net/java/GA/jdk24.0.2/fdc5d0102fe0414db21410ad5834341f/12/GPL/openjdk-24.0.2_linux-x64_bin.tar.gz
          tar -xzf openjdk-24.0.2_linux-x64_bin.tar.gz

      - name: Dump Minecraft server registries
        working-directory: server
        run: |
          mkdir -p notchian
          cd notchian
          curl -Lo server.jar https://piston-data.mojang.com/v1/objects/6bce4ef400e4efaa63a13d5e6f6b500be969ef81/server.jar
          echo "eula=true" > eula.txt
          ../../jdk-24.0.2/bin/java -DbundlerMainClass="net.minecraft.data.Main" -jar server.jar --all

      - name: Generate registry headers
        working-directory: server
        run: |
          bun run build_registries.js

      - name: Build server binary
        working-directory: server
        run: |
          cosmocc src/*.c -O2 -Iinclude -o bareiron

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: bareiron-server
          path: server/bareiron

  build-android:
    runs-on: ubuntu-24.04
    name: Build Android APK
    needs: build-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Grant execute permissions
        working-directory: app
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Android APK
        working-directory: app
        run: |
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bareiron-apk
          path: app/app/build/outputs/apk/debug/*.apk

  release:
    runs-on: ubuntu-24.04
    name: Create Release
    needs: [build-server, build-android]

    steps:
      - name: Download server artifact
        uses: actions/download-artifact@v4
        with:
          name: bareiron-server
          path: ./artifacts/

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: bareiron-apk
          path: ./artifacts/

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BAREIRON Latest Build
          body: |
            Rolling release of BAREIRON Server + Android Content Manager.
            
            | File | Description |
            |------|-------------|
            | `bareiron` | Server binary (Cosmopolitan, runs on Linux/Windows/Mac) |
            | `app-debug.apk` | Android Content Manager APK |
            
            Server is ~227KB. App manages realms, dimensions, cities, add-ons.
          files: ./artifacts/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
